# PostgreSQL 同时保存业务数据、索引任务、原文片段与向量；原文件继续使用已有共享卷。
name: team-rag
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?run scripts/init_env.py}@postgres:5432/rag
  UPLOAD_DIR: /app/data/uploads
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init_env.py}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1500m
  api:
    image: team-rag-local:pgvector
    build: .
    env_file: .env
    environment: *app-env
    volumes: ["upload_data:/app/data/uploads"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m
  worker:
    image: team-rag-local:pgvector
    build: .
    env_file: .env
    environment: *app-env
    volumes: ["upload_data:/app/data/uploads"]
    command: ["python", "-m", "app.worker"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
# 旧 MySQL/ES 数据卷不删除；新库使用独立卷，原文件卷保持名称不变。
volumes:
  postgres_data:
  upload_data:
